<title>El Viajero Inquieto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --ink:#1F2926;
  --ink-2:#33443F;
  --sage:#8FA89A;
  --sage-deep:#5C7267;
  --sand:#E9E1D2;
  --sand-deep:#D8CBB2;
  --ivory:#F7F5EF;
  --lagoon:#5F8F95;
  --lagoon-deep:#3E6A6F;

  --bg:var(--ivory);
  --bg-alt:var(--sand);
  --surface:#FFFFFF;
  --surface-sunken:#FBF9F4;
  --text:var(--ink);
  --text-muted:#5B685F;
  --border:rgba(31,41,38,0.14);
  --border-strong:rgba(31,41,38,0.28);
  --accent:var(--lagoon-deep);
  --accent-soft:rgba(95,143,149,0.14);
  --accent-contrast:#FFFFFF;
  --on-dark:var(--ivory);

  --ok-bg:#E4EEE3; --ok-fg:#3E6B4A;
  --warn-bg:#F6ECD9; --warn-fg:#8A5F1E;
  --bad-bg:#F3E1DE; --bad-fg:#9C4A3E;

  --shadow-sm:0 1px 2px rgba(31,41,38,0.08);
  --shadow-md:0 8px 24px rgba(31,41,38,0.10);
  --shadow-lg:0 20px 48px rgba(31,41,38,0.16);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161E1B;
    --bg-alt:#1E2823;
    --surface:#1C2622;
    --surface-sunken:#141B18;
    --text:#F3F1E9;
    --text-muted:#AEBBB1;
    --border:rgba(243,241,233,0.14);
    --border-strong:rgba(243,241,233,0.26);
    --accent:#8FC2C6;
    --accent-soft:rgba(143,194,198,0.16);
    --accent-contrast:#0F1815;
    --ok-bg:#233A2A; --ok-fg:#8FD3A0;
    --warn-bg:#3A2F1B; --warn-fg:#E4B871;
    --bad-bg:#3A241F; --bad-fg:#E4948A;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.35);
    --shadow-lg:0 24px 56px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#161E1B; --bg-alt:#1E2823; --surface:#1C2622; --surface-sunken:#141B18;
  --text:#F3F1E9; --text-muted:#AEBBB1;
  --border:rgba(243,241,233,0.14); --border-strong:rgba(243,241,233,0.26);
  --accent:#8FC2C6; --accent-soft:rgba(143,194,198,0.16); --accent-contrast:#0F1815;
  --ok-bg:#233A2A; --ok-fg:#8FD3A0; --warn-bg:#3A2F1B; --warn-fg:#E4B871; --bad-bg:#3A241F; --bad-fg:#E4948A;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 8px 24px rgba(0,0,0,0.35); --shadow-lg:0 24px 56px rgba(0,0,0,0.5);
}

/* ---------- base ---------- */
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  padding:0;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  color:var(--text);
  font-weight:600;
  line-height:1.12;
  text-wrap:balance;
  margin:0;
}
p{margin:0;}
a{color:inherit;}
button{font-family:var(--font-body);}
img{max-width:100%;display:block;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
}

.container{max-width:1180px;margin:0 auto;padding-inline:24px;}
@media (max-width:560px){ .container{padding-inline:16px;} }

.eyebrow{
  font-family:var(--font-body);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12px;
  font-weight:700;
  color:var(--accent);
}
.section{padding-block:64px;}
.section-sunken{background:var(--bg-alt);}
@media (max-width:640px){ .section{padding-block:44px;} }

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:100px;border:1px solid transparent;
  font-weight:700;font-size:14.5px;letter-spacing:.01em;
  padding:13px 26px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  text-decoration:none;white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:var(--ivory);}
.btn-primary:hover{box-shadow:var(--shadow-md);}
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){ }
.btn-accent{background:var(--accent);color:var(--accent-contrast);}
.btn-accent:hover{box-shadow:var(--shadow-md);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border-strong);}
.btn-ghost:hover{background:var(--accent-soft);border-color:var(--accent);}
.btn-block{width:100%;}
.btn-sm{padding:8px 16px;font-size:13px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:100px;}
.badge-demo{background:var(--ink);color:var(--ivory);}
:root[data-theme="dark"] .badge-demo{background:var(--accent);color:var(--accent-contrast);}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:100px;}
.chip-ok{background:var(--ok-bg);color:var(--ok-fg);}
.chip-warn{background:var(--warn-bg);color:var(--warn-fg);}
.chip-bad{background:var(--bad-bg);color:var(--bad-fg);}

.tabular{font-variant-numeric:tabular-nums;}

/* ---------- header ---------- */
#siteHeader{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:16px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:38px;height:38px;flex:none;}
.brand-mark img{width:100%;height:100%;object-fit:contain;}
.brand-mark .logo-dark{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand-mark .logo-light{display:none;}
  :root:not([data-theme="light"]) .brand-mark .logo-dark{display:block;}
}
:root[data-theme="dark"] .brand-mark .logo-light{display:none;}
:root[data-theme="dark"] .brand-mark .logo-dark{display:block;}
.brand-word{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.01em;}
.brand-sub{display:block;font-family:var(--font-body);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-top:1px;}
.nav-links{display:flex;align-items:center;gap:28px;}
.nav-link{font-size:14.5px;font-weight:500;cursor:pointer;color:var(--text-muted);padding:6px 0;border-bottom:2px solid transparent;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--text);border-color:var(--accent);}
.nav-cta{display:flex;align-items:center;gap:14px;}
.nav-fav{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--border-strong);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-fav:hover{background:var(--accent-soft);border-color:var(--accent);}
.nav-fav svg{width:17px;height:17px;}
.nav-fav.active{color:#C6483B;border-color:#C6483B;}
.nav-fav.active svg{fill:#C6483B;}
.nav-fav-count{position:absolute;top:-4px;right:-4px;background:var(--ink);color:var(--ivory);font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.nav-burger{display:none;background:none;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--text);}
.nav-burger svg{width:18px;height:18px;}
@media (max-width:900px){
  .nav-links{display:none;}
  .nav-burger{display:inline-flex;}
}
#mobileNav{display:none;border-top:1px solid var(--border);padding:14px 0 18px;flex-direction:column;gap:14px;}
#mobileNav.open{display:flex;}
#mobileNav .nav-link{font-size:16px;}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:56px 40px;}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:48px;align-items:center;}
@media (max-width:900px){ .hero-grid{grid-template-columns:1fr;gap:32px;} }
.hero-eyebrow{margin-bottom:18px;}
.hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:.005em;}
.hero h1 em{font-style:italic;color:var(--accent);}
.hero-lede{margin-top:18px;max-width:46ch;color:var(--text-muted);font-size:17px;}
.hero-actions{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
.hero-art-ring{position:relative;max-width:440px;margin-inline:auto;}
.hero-art-ring::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:1.5px dashed var(--sage-deep);opacity:.55;pointer-events:none;}
.hero-art-ring-sm{max-width:320px;}
.hero-art{aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-lg);}
.hero-art img{width:100%;height:100%;object-fit:cover;}
.hero-stats{display:flex;gap:28px;margin-top:38px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-display);font-size:28px;}
.hero-stat span{font-size:12.5px;color:var(--text-muted);}

.search-card{
  margin-top:34px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  box-shadow:var(--shadow-md);padding:18px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end;
}
@media (max-width:760px){ .search-card{grid-template-columns:1fr 1fr;} }
.field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px;}
.field select, .field input{
  width:100%;border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--text);
  border-radius:var(--radius-s);padding:11px 12px;font-size:14.5px;font-family:var(--font-body);
}
.field select:focus, .field input:focus{border-color:var(--accent);}

/* ---------- generic section headers ---------- */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);}
.section-head p{color:var(--text-muted);margin-top:8px;max-width:52ch;}

/* ---------- category cards ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:860px){ .cat-grid{grid-template-columns:1fr;} }
.cat-card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:30px 26px;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;overflow:hidden;
}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.cat-icon{width:56px;height:56px;margin-bottom:20px;}
.cat-card h3{font-size:23px;margin-bottom:8px;}
.cat-card p{color:var(--text-muted);font-size:14.5px;}
.cat-count{position:absolute;top:26px;right:26px;font-size:12px;font-weight:700;color:var(--text-muted);}

/* ---------- listing cards ---------- */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:980px){ .card-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .card-grid{grid-template-columns:1fr;} }
.lcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;
  cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;display:flex;flex-direction:column;
}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.lcard-art{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.lcard-art svg{width:52%;height:52%;}
.lcard-art img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease;}
.lcard:hover .lcard-art img{transform:scale(1.04);}
.lcard-tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.86);color:var(--ink);font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
:root[data-theme="dark"] .lcard-tag{background:rgba(20,27,24,.82);color:var(--ivory);}
.lcard-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
.lcard-loc{font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;}
.lcard-name{font-family:var(--font-display);font-size:21px;font-weight:600;}
.lcard-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--border);}
.lcard-price b{font-size:16.5px;}
.lcard-price span{font-size:12px;color:var(--text-muted);}
.lcard-rating{display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;}

/* ---------- filter bar ---------- */
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:28px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.filter-bar select{border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--text);border-radius:var(--radius-s);padding:9px 12px;font-size:13.5px;}
.filter-count{margin-left:auto;font-size:13px;color:var(--text-muted);}

/* ---------- breadcrumb ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-muted);margin-bottom:22px;}
.crumb span{cursor:pointer;}
.crumb span:hover{color:var(--accent);}

/* ---------- detail ---------- */
.detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:44px;align-items:start;}
@media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
.detail-art{aspect-ratio:16/9;border-radius:var(--radius-l);display:flex;align-items:center;justify-content:center;margin-bottom:26px;overflow:hidden;}
.detail-art svg{width:34%;height:34%;}
.detail-art img{width:100%;height:100%;object-fit:cover;}
.detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.detail-title-row h1{font-size:clamp(28px,4vw,40px);}
.detail-loc{color:var(--text-muted);margin-top:8px;font-size:15px;}
.detail-rating{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;}
.detail-highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 22px;margin-top:22px;}
@media (max-width:480px){ .detail-highlights{grid-template-columns:1fr;} }
.hl-item{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;}
.hl-item svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent);}
.detail-desc{margin-top:26px;color:var(--text-muted);max-width:64ch;}
.detail-desc + .detail-desc{margin-top:10px;}

.book-card{position:sticky;top:96px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:24px;box-shadow:var(--shadow-md);}
.book-price{display:flex;align-items:baseline;gap:6px;margin-bottom:18px;}
.book-price b{font-family:var(--font-display);font-size:30px;}
.book-price span{color:var(--text-muted);font-size:13.5px;}
.book-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.book-fields .field{grid-column:span 1;}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-strong);border-radius:var(--radius-s);padding:9px 12px;background:var(--surface-sunken);}
.stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:16px;line-height:1;}
.book-breakdown{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:14px;}
.book-breakdown .row{display:flex;justify-content:space-between;}
.book-breakdown .total{font-weight:700;font-size:16px;padding-top:8px;border-top:1px solid var(--border);}

/* ---------- reviews ---------- */
.review-row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){ .review-row{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .review-row{grid-template-columns:1fr;} }
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:24px;display:flex;flex-direction:column;gap:14px;}
.review-stars{color:#C99A3E;letter-spacing:2px;font-size:14px;}
.review-quote{font-family:var(--font-display);font-size:19px;font-style:italic;line-height:1.4;}
.review-who{display:flex;align-items:center;gap:10px;margin-top:auto;}
.review-avatar{width:38px;height:38px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;color:var(--ink);flex:none;}
.review-name{font-weight:700;font-size:14px;}
.review-origin{font-size:12.5px;color:var(--text-muted);}

/* ---------- trust strip ---------- */
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
@media (max-width:900px){ .trust-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:520px){ .trust-grid{grid-template-columns:1fr;} }
.trust-item svg{width:30px;height:30px;color:var(--accent);margin-bottom:14px;}
.trust-item h4{font-size:17px;margin-bottom:6px;}
.trust-item p{color:var(--text-muted);font-size:14px;}

/* ---------- footer ---------- */
#siteFooter{background:var(--ink);color:var(--ivory);padding-block:52px 28px;}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;}
@media (max-width:760px){ .foot-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:480px){ .foot-grid{grid-template-columns:1fr;} }
.foot-grid h5{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:#B9C7C2;margin-bottom:14px;}
.foot-link{display:block;font-size:14px;color:#DCE6E2;margin-bottom:9px;cursor:pointer;opacity:.9;}
.foot-link:hover{opacity:1;text-decoration:underline;}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;border-top:1px solid rgba(247,245,239,0.14);font-size:12.5px;color:#9FB0AA;flex-wrap:wrap;gap:10px;}
.foot-admin{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.foot-admin-group{display:flex;gap:18px;flex-wrap:wrap;}

/* ---------- booking flow ---------- */
.flow-wrap{max-width:760px;margin:0 auto;}
.flow-steps{display:flex;justify-content:space-between;margin-bottom:40px;position:relative;}
.flow-steps::before{content:"";position:absolute;top:15px;left:6%;right:6%;height:2px;background:var(--border-strong);}
.flow-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);padding-inline:6px;z-index:1;}
.flow-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;background:var(--surface);}
.flow-step.done .flow-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.flow-step.current .flow-dot{border-color:var(--accent);color:var(--accent);}
.flow-label{font-size:12px;color:var(--text-muted);font-weight:600;}
.flow-step.current .flow-label{color:var(--text);}
.flow-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:32px;box-shadow:var(--shadow-sm);}
@media (max-width:560px){ .flow-panel{padding:22px;} }
.flow-panel h2{font-size:24px;margin-bottom:6px;}
.flow-sub{color:var(--text-muted);font-size:14.5px;margin-bottom:26px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
.form-grid .full{grid-column:1/-1;}

.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
@media (max-width:560px){ .pay-methods{grid-template-columns:1fr;} }
.pay-opt{border:1.5px solid var(--border-strong);border-radius:var(--radius-s);padding:14px;cursor:pointer;text-align:center;transition:border-color .15s ease, background .15s ease;}
.pay-opt svg{width:24px;height:24px;margin-bottom:8px;}
.pay-opt span{display:block;font-size:13.5px;font-weight:700;}
.pay-opt.selected{border-color:var(--accent);background:var(--accent-soft);}
.wompi-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);margin-top:16px;}
.wompi-badge b{color:var(--text);font-weight:700;}
.wompi-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

.flow-actions{display:flex;justify-content:space-between;margin-top:28px;gap:12px;}
.confirm-hero{text-align:center;padding-block:12px 8px;}
.confirm-check{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.confirm-code{font-family:var(--font-display);font-size:30px;font-weight:600;margin-top:6px;}
.confirm-grid{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:10px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
.confirm-grid .row{display:flex;justify-content:space-between;font-size:14.5px;}
.confirm-grid .row b{font-weight:700;}

/* ---------- admin ---------- */
#adminShell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--bg);}
@media (max-width:820px){ #adminShell{grid-template-columns:minmax(0,1fr);} }
#adminSidebar{background:var(--ink);color:var(--ivory);padding:22px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;}
@media (max-width:820px){ #adminSidebar{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:10px;} }
#adminMain{min-width:0;}
.admin-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;}
@media (max-width:820px){ .admin-brand{padding:4px 6px;} }
.admin-brand span{font-family:var(--font-display);font-weight:600;font-size:17px;}
.admin-nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500;color:#C9D6D1;}
.admin-nav-item svg{width:18px;height:18px;flex:none;}
.admin-nav-item:hover{background:rgba(247,245,239,.06);}
.admin-nav-item.active{background:rgba(247,245,239,.1);color:#fff;}
.admin-exit{margin-top:auto;padding:11px 12px;font-size:13.5px;color:#9FB0AA;cursor:pointer;}
@media (max-width:820px){ .admin-exit{margin-top:0;margin-left:auto;} }
#adminMain{padding:30px 34px 60px;max-width:1240px;}
@media (max-width:640px){ #adminMain{padding:20px 18px 40px;} }
.admin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
.admin-head h1{font-size:28px;}
.admin-head p{color:var(--text-muted);margin-top:6px;font-size:14.5px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:30px;}
@media (max-width:980px){ .stat-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:520px){ .stat-grid{grid-template-columns:1fr;} }
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
.stat-tile span{font-size:12.5px;color:var(--text-muted);font-weight:600;}
.stat-tile b{display:block;font-family:var(--font-display);font-size:28px;margin-top:8px;}
.stat-tile em{display:block;font-style:normal;font-size:12.5px;color:var(--ok-fg);margin-top:4px;font-weight:700;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:24px;margin-bottom:24px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.panel-head h3{font-size:18px;font-family:var(--font-body);font-weight:700;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.wrap{white-space:normal;}
.row-actions{display:flex;gap:8px;}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent);}
.icon-btn svg{width:15px;height:15px;}
.mini-input{width:100px;border:1px solid var(--border-strong);background:var(--surface-sunken);border-radius:8px;padding:6px 8px;font-size:13.5px;font-family:var(--font-body);}
.switch{position:relative;width:38px;height:22px;border-radius:100px;background:var(--border-strong);cursor:pointer;flex:none;}
.switch.on{background:var(--accent);}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s ease;}
.switch.on::after{left:18px;}

.bar-chart-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-top:6px;}

.cms-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:900px){ .cms-grid{grid-template-columns:1fr;} }
.cms-field label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.cms-field input, .cms-field textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--text);border-radius:var(--radius-s);padding:10px 12px;font-family:var(--font-body);font-size:14px;margin-bottom:14px;}
.cms-field textarea{resize:vertical;min-height:80px;}
.cms-preview{border:1px dashed var(--border-strong);border-radius:var(--radius-m);padding:22px;background:var(--bg-alt);}
.cms-preview-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px;}
.cms-preview h2{font-size:24px;}
.cms-preview p{margin-top:8px;color:var(--text-muted);font-size:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:100;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
:root[data-theme="dark"] .toast{background:var(--accent);color:var(--accent-contrast);}
.toast.show{opacity:1;transform:translate(-50%,-6px);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-alt);}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:34px;box-shadow:var(--shadow-lg);}
.login-card h2{font-size:24px;margin-bottom:6px;}
.login-card p{color:var(--text-muted);font-size:13.5px;margin-bottom:24px;}
.login-card .field{margin-bottom:14px;}

.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.empty-note{font-size:13.5px;color:var(--text-muted);padding:18px 0;text-align:center;}

/* ---------- chat widget ---------- */
#chatRoot{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:14px;}
@media (max-width:480px){ #chatRoot{right:14px;bottom:14px;} }
.chat-fab{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--ivory);border:none;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s ease;}
.chat-fab:hover{transform:scale(1.05);}
.chat-fab svg{width:26px;height:26px;}
.chat-fab .icon-close{display:none;}
.chat-fab.open .icon-chat{display:none;}
.chat-fab.open .icon-close{display:block;}
.chat-dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--lagoon);border:2px solid var(--bg);}

.chat-tooltip{position:absolute;bottom:70px;right:0;max-width:230px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-m) var(--radius-m) 4px var(--radius-m);box-shadow:var(--shadow-lg);padding:14px 16px;font-size:13.5px;line-height:1.4;animation:fadeIn .3s ease both;}
.chat-tooltip button{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:4px;line-height:1;}
.chat-tooltip p{padding-right:12px;}

.chat-panel{width:min(360px, calc(100vw - 32px));height:min(520px, calc(100vh - 120px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;}
.chat-panel.open{display:flex;}
.chat-head{background:var(--ink);color:var(--ivory);padding:16px 18px;display:flex;align-items:center;gap:10px;flex:none;}
.chat-head img{width:32px;height:32px;object-fit:contain;flex:none;}
.chat-head b{font-family:var(--font-display);font-size:17px;display:block;}
.chat-head span{font-size:11.5px;color:#B9C7C2;display:flex;align-items:center;gap:5px;}
.chat-head span::before{content:"";width:7px;height:7px;border-radius:50%;background:#7ED0A0;display:inline-block;}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg-alt);}
.chat-msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;}
.chat-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
.chat-msg.user{align-self:flex-end;background:var(--ink);color:var(--ivory);border-bottom-right-radius:4px;}
.chat-results{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.chat-result{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;}
.chat-result:hover{border-color:var(--accent);}
.chat-result b{font-size:13px;display:block;}
.chat-result span{font-size:11.5px;color:var(--text-muted);}
.chat-result strong{font-size:13px;white-space:nowrap;}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chat-chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text);}
.chat-chip:hover{border-color:var(--accent);background:var(--accent-soft);}
.chat-input-row{flex:none;border-top:1px solid var(--border);padding:12px;display:flex;gap:8px;background:var(--surface);}
.chat-input-row input{flex:1;border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--text);border-radius:100px;padding:10px 16px;font-size:13.5px;font-family:var(--font-body);}
.chat-input-row button{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.chat-input-row button svg{width:17px;height:17px;}
.chat-input-row button[disabled]{opacity:.4;cursor:not-allowed;}

/* ---------- scroll reveal ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease, transform .55s ease;}
.reveal.in-view{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){ .reveal{opacity:1;transform:none;transition:none;} }

/* ---------- favorites (heart) ---------- */
.lcard-fav{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.86);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;transition:transform .15s ease;}
.lcard-fav:hover{transform:scale(1.08);}
.lcard-fav svg{width:17px;height:17px;}
.lcard-fav.active{color:#C6483B;}
.lcard-fav.active svg{fill:#C6483B;}
:root[data-theme="dark"] .lcard-fav{background:rgba(20,27,24,.82);color:var(--ivory);}
.lcard-photocount{position:absolute;bottom:12px;right:12px;background:rgba(20,27,24,.72);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px;z-index:2;}
.gallery-wrap{margin-bottom:26px;}
.gallery-wrap .detail-art{margin-bottom:10px;cursor:zoom-in;position:relative;}
.gallery-fav{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.88);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;}
.gallery-fav svg{width:20px;height:20px;}
.gallery-fav.active{color:#C6483B;}
.gallery-fav.active svg{fill:#C6483B;}
.gallery-count{position:absolute;bottom:16px;right:16px;background:rgba(20,27,24,.72);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:100px;}
.gallery-thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.gthumb{flex:none;width:76px;height:56px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;opacity:.6;transition:opacity .15s ease, border-color .15s ease;}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.gthumb.active{opacity:1;border-color:var(--accent);}
.gthumb:hover{opacity:1;}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;background:rgba(15,20,18,.94);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease both;}
.lightbox img{max-width:min(88vw,1000px);max-height:82vh;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lightbox-close svg{width:18px;height:18px;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lightbox-nav svg{width:20px;height:20px;}
.lightbox-nav.prev{left:16px;} .lightbox-nav.next{right:16px;}
.lightbox-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.12);padding:5px 14px;border-radius:100px;}
@media (max-width:560px){ .lightbox-nav{width:40px;height:40px;} }

/* ---------- photo category tiles ---------- */
.cat-card-photo{position:relative;overflow:hidden;color:#fff;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;}
.cat-card-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease;z-index:0;}
.cat-card-photo:hover img{transform:scale(1.06);}
.cat-card-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,20,18,0) 35%, rgba(15,20,18,.82) 100%);z-index:1;}
.cat-card-photo .cat-count{color:rgba(255,255,255,.85);z-index:2;top:20px;right:20px;}
.cat-card-photo .cat-icon{display:none;}
.cat-card-photo h3, .cat-card-photo p{position:relative;z-index:2;color:#fff;}
.cat-card-photo p{color:rgba(255,255,255,.82);}

/* ---------- destinations strip ---------- */
.dest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
@media (max-width:900px){ .dest-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ .dest-grid{grid-template-columns:1fr;} }
.dest-card{position:relative;border-radius:var(--radius-m);overflow:hidden;aspect-ratio:3/4;cursor:pointer;color:#fff;}
.dest-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.dest-card:hover img{transform:scale(1.07);}
.dest-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,20,18,0) 45%, rgba(15,20,18,.85) 100%);}
.dest-card-label{position:absolute;left:16px;bottom:14px;z-index:2;}
.dest-card-label b{font-family:var(--font-display);font-size:19px;display:block;}
.dest-card-label span{font-size:11.5px;color:rgba(255,255,255,.85);}

/* ---------- animated stat counters ---------- */
.hero-stat b{font-variant-numeric:tabular-nums;}

/* ---------- testimonial carousel ---------- */
.carousel-wrap{position:relative;}
.carousel-track{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none;}
.carousel-track::-webkit-scrollbar{display:none;}
.carousel-track .review-card{flex:0 0 min(320px,86vw);scroll-snap-align:start;}
.carousel-arrows{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
@media (max-width:640px){ .carousel-arrows{display:none;} }
.carousel-arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.carousel-arrow:hover{background:var(--accent-soft);border-color:var(--accent);}
.carousel-arrow svg{width:16px;height:16px;}

/* ---------- admin calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start;}
@media (max-width:980px){ .cal-wrap{grid-template-columns:1fr;} }
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.cal-head h3{font-family:var(--font-body);font-size:17px;font-weight:700;text-transform:capitalize;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.cal-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav button:hover{background:var(--accent-soft);border-color:var(--accent);}
.cal-nav svg{width:14px;height:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-daylabel{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;}
.cal-day{min-height:118px;border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;}
.cal-day:hover{border-color:var(--accent);}
.cal-day.other-month{opacity:.35;}
.cal-day.today{border-color:var(--accent);border-width:2px;}
.cal-day.selected{background:var(--accent-soft);border-color:var(--accent);}
.cal-day-num{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-chip{font-size:11.5px;font-weight:700;line-height:1.3;background:var(--sand);color:var(--ink);padding:3px 7px;border-radius:6px;white-space:normal;word-break:normal;overflow-wrap:break-word;width:100%;box-sizing:border-box;align-self:stretch;}
:root[data-theme="dark"] .cal-chip{background:var(--accent-soft);color:var(--accent);}
.cal-chip-more{font-size:10.5px;font-weight:700;color:var(--text-muted);padding:1px 7px;}
@media (max-width:640px){ .cal-day{min-height:92px;} }
.cal-side{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
.cal-side h4{font-family:var(--font-body);font-size:15px;font-weight:700;margin-bottom:12px;}
.cal-booking-item{padding:11px 0;border-bottom:1px solid var(--border);}
.cal-booking-item:last-child{border-bottom:none;}
.cal-booking-item b{display:block;font-size:14px;}
.cal-booking-item span{font-size:12.5px;color:var(--text-muted);display:block;margin-top:2px;}
.cal-empty{font-size:13px;color:var(--text-muted);}

/* filters + availability check */
.cal-filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:22px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;align-items:end;}
@media (max-width:760px){ .cal-filters{grid-template-columns:1fr 1fr;} }
.cal-filters .btn{white-space:nowrap;}
.cal-daterange{grid-column:span 2;display:flex;align-items:stretch;border:1px solid var(--border-strong);border-radius:var(--radius-s);background:var(--surface-sunken);overflow:hidden;}
@media (max-width:760px){ .cal-daterange{grid-column:span 2;} }
.cal-daterange:focus-within{border-color:var(--accent);}
.cal-daterange-part{flex:1;min-width:0;padding:7px 12px;display:flex;flex-direction:column;gap:2px;}
.cal-daterange-part label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
.cal-daterange-part input{border:none;background:transparent;padding:0;font-size:14.5px;color:var(--text);font-family:var(--font-body);width:100%;}
.cal-daterange-part input:focus{outline:none;}
.cal-daterange-sep{display:flex;align-items:center;padding:0 2px;color:var(--text-muted);border-left:1px solid var(--border);border-right:1px solid var(--border);flex:none;}
.cal-daterange-sep svg{width:12px;height:12px;}
.cal-avail-list{display:flex;flex-direction:column;gap:10px;}
.cal-avail-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;}

.doc-type-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}

.doc-type-tab.active{background:var(--ink);border-color:var(--ink);color:var(--ivory);}
.doc-layout{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
@media (max-width:980px){ .doc-layout{grid-template-columns:1fr;} }
.doc-items-row{display:grid;grid-template-columns:1fr 70px 120px 32px;gap:8px;margin-bottom:8px;align-items:center;}

function findInText(text, keys){

function expandNearby(towns){
  const set = new Set(towns);
  towns.forEach(function(t){ (NEARBY_TOWNS[t]||[]).forEach(function(n){ set.add(n); }); });

}

}

function answerChat(raw){
  const norm = normalizeText(raw);
  if(!norm) return {text:"Escribe tu pregunta, por ejemplo: \"¿qué finca hay cerca a Manizales?\"", chips:[]};

  for(let i=0;i<CHAT_INTENTS.length;i++){
    if(CHAT_INTENTS[i].test.test(norm)) return CHAT_INTENTS[i].reply();
  }

  let results = LISTINGS.slice();
  const towns = findInText(norm, TOWN_KEYS);
  const depts = findInText(norm, DEPT_KEYS);
  const hasCerca = /cerca/.test(norm);
  let usedLocationFilter = false;

  if(towns.length){
    const townSet = hasCerca ? expandNearby(towns) : towns;
    results = results.filter(function(l){ return townSet.indexOf(normalizeText(l.town))>-1; });
    usedLocationFilter = true;
  } else if(depts.length){
    results = results.filter(function(l){ return depts.indexOf(normalizeText(l.dept))>-1; });
    usedLocationFilter = true;
  }

  const cat = findCategory(norm);
  if(cat){ results = results.filter(function(l){ return l.cat===cat; }); }

  const priceMatch = norm.match(/(menos de|hasta|maximo|máximo|por debajo de)\s*\$?\s*([\d.,]+)\s*(mil)?/);
  if(priceMatch){
    let num = parseFloat(priceMatch[2].replace(/[.,]/g,""));
    if(priceMatch[3]) num *= 1000;
    if(!isNaN(num)) results = results.filter(function(l){ return l.price<=num; });
  }
  const wantsCheap = /barato|economic|econom|menor precio/.test(norm);
  const wantsTop = /mejor calificad|mejor valorad|mas recomendad|más recomendad|^top\b|mejor opcion|mejor opción/.test(norm);
  if(wantsCheap) results = results.slice().sort(function(a,b){return a.price-b.price;});
  else if(wantsTop) results = results.slice().sort(function(a,b){return b.rating-a.rating;});

  const capMatch = norm.match(/(\d+)\s*persona/);
  if(capMatch){
    const n = parseInt(capMatch[1],10);
    results = results.filter(function(l){ return l.cat!=="alojamientos" || l.cap>=n; });
  }

  if(!cat && !usedLocationFilter && !priceMatch && !wantsCheap && !wantsTop && !capMatch){
    return {text:"No estoy segura de haber entendido. Puedo buscar por destino (ej. \"cerca a Manizales\"), tipo (fincas, parques, tours), precio o calificación.", chips:["Fincas cerca a Manizales","Parques para niños","Lo más barato","Mejor calificado"]};
  }
  if(!results.length){
    return {text:"No encontré opciones exactas para eso. Tenemos fincas y cabañas, parques temáticos y tours en Quindío, Caldas y Risaralda.", chips:["Fincas y Cabañas","Parques Temáticos","Tours"]};
  }
  const top = results.slice(0,4);
  const label = cat ? catLabel(cat).toLowerCase() : "opciones";
  return {text:"Encontré "+top.length+" "+label+(top.length!==results.length?" (de "+results.length+")":"")+" que podrían servirte:", listings:top.map(chatFormatListing)};
}

/* ================= HELPERS ================= */
function cop(n){ return "$"+Math.round(n).toLocaleString("es-CO"); }
function numberToWords(n){
  n = Math.round(n);
  if(n===0) return "CERO";
  const UNI = ["","UN","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];
  const DEC = ["","","VEINTI","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const CEN = ["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  function tri2(x){
    if(x===0) return "";
    const c=Math.floor(x/100), r=x%100;
    let s = c>0 ? (x===100?"CIEN":CEN[c])+" " : "";
    if(r===0) return s.trim();
    if(r<=20) s += UNI[r];
    else if(r<30) s += "VEINTI"+UNI[r-20];
    else { const d=Math.floor(r/10), u=r%10; s += DEC[d] + (u>0?" Y "+UNI[u]:""); }
    return s.trim();
  }
  const millones = Math.floor(n/1000000);
  const miles = Math.floor((n%1000000)/1000);
  const cientos = n%1000;
  let parts = [];
  if(millones>0) parts.push(millones===1?"UN MILLÓN":tri2(millones)+" MILLONES");
  if(miles>0) parts.push(miles===1?"MIL":tri2(miles)+" MIL");
  if(cientos>0) parts.push(tri2(cientos));
  return parts.join(" ").trim();
}
function copWords(n){ return numberToWords(n) + " PESOS M/CTE"; }
function stars(n){ const full=Math.round(n); return "★★★★★☆☆☆☆☆".slice(5-full,10-full); }
function byId(id){ return LISTINGS.find(function(l){return l.id===id;}); }
function catLabel(cat){ return cat==="alojamientos"?"Fincas y Cabañas":cat==="parques"?"Parques Temáticos":"Tours"; }
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h);
  toast._h=setTimeout(function(){t.classList.remove("show");},2200);
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ================= CATALOG ================= */
function renderCatalog(cat){
  S.catalog.cat=cat;
  let items = LISTINGS.filter(function(l){return l.cat===cat;});
  const towns = Array.from(new Set(items.map(function(l){return l.town;})));
  if(S.catalog.town!=="todos") items = items.filter(function(l){return l.town===S.catalog.town;});
  if(S.catalog.sort==="precio-asc") items=items.slice().sort(function(a,b){return a.price-b.price;});
  if(S.catalog.sort==="precio-desc") items=items.slice().sort(function(a,b){return b.price-a.price;});
  if(S.catalog.sort==="rating") items=items.slice().sort(function(a,b){return b.rating-a.rating;});

  const titleMap={alojamientos:["Fincas y Cabañas","Descansa en casonas cafeteras y refugios de montaña operados por anfitriones locales."],parques:["Parques Temáticos","Café, agro y naturaleza en un solo día, con entradas listas desde antes de llegar."],tours:["Tours y Actividades","Caminatas, agua y miradores del eje cafetero, con guía y transporte incluidos."]};
  const t = titleMap[cat];
  return '<section class="section" style="padding-top:40px;"><div class="container">' +
    '<div class="crumb"><span data-go="home">Inicio</span> / <span>'+t[0]+'</span></div>' +
    '<div class="section-head"><div><p class="eyebrow">Catálogo</p><h2>'+t[0]+'</h2><p>'+t[1]+'</p></div></div>' +
    '<div class="filter-bar">' +
      '<select id="filterTown"><option value="todos">Todos los municipios</option>' + towns.map(function(tw){return '<option'+(S.catalog.town===tw?' selected':'')+'>'+tw+'</option>';}).join('') + '</select>' +
      '<select id="filterSort">' +
        '<option value="recomendado">Recomendados</option>' +
        '<option value="precio-asc">Precio: menor a mayor</option>' +
        '<option value="precio-desc">Precio: mayor a menor</option>' +
        '<option value="rating">Mejor calificados</option>' +
      '</select>' +
      '<span class="filter-count">'+items.length+' resultado'+(items.length===1?'':'s')+'</span>' +
    '</div>' +
    (items.length? '<div class="card-grid">'+items.map(listingCard).join('')+'</div>' : '<p class="empty-note">No hay resultados para este filtro.</p>') +
  '</div></section>';
}

      '<div class="pay-methods">' +

      (b.payMethod==='card' ? '<div class="form-grid">' +
        '<div class="field full"><label>Número de tarjeta</label><input id="fCard" placeholder="4111 1111 1111 1111"></div>' +
        '<div class="field"><label>Vencimiento</label><input id="fExp" placeholder="MM/AA"></div>' +
        '<div class="field"><label>CVV</label><input id="fCvv" placeholder="123"></div>' +
      '</div>' : '<p style="font-size:13.5px;color:var(--text-muted);">Serás redirigido a tu entidad financiera para confirmar el pago de forma segura (simulado en esta demo).</p>') +
      '<div class="wompi-badge"><span class="wompi-dot"></span>Pago procesado por <b>Wompi</b> · conexión cifrada</div>';
  } else {
    body = '<div class="confirm-hero"><div class="confirm-check">'+icon('check')+'</div>' +
      '<p class="eyebrow">Reserva confirmada</p><div class="confirm-code">'+(b.lastCode||"VJI-0000")+'</div>' +
      '<p style="color:var(--text-muted);margin-top:8px;">Enviamos el comprobante a '+esc(b.email||"tu correo")+'</p>' +

        '<div class="row"><span>Experiencia</span><b>'+l.name+'</b></div>' +

      '<div class="flow-actions" style="justify-content:center;"><button class="btn btn-primary" data-go="home">Volver al inicio</button></div>' +

/* ================= CALENDARIO DE RESERVAS (fincas) ================= */
function fincaListings(){ return LISTINGS.filter(function(l){ return l.cat==="alojamientos"; }); }
function fincaById(id){ return LISTINGS.find(function(l){ return l.id===id; }); }
function isoDate(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function fincaFilteredBookings(){
  const fincaId = S.calendar.filterFinca;
  return (!fincaId || fincaId==="todas") ? FINCA_BOOKINGS : FINCA_BOOKINGS.filter(function(b){ return b.fincaId===fincaId; });
}
function bookingsOnDate(iso){ return fincaFilteredBookings().filter(function(b){ return iso>=b.checkin && iso<b.checkout; }); }
function rangesOverlap(fromA,toA,fromB,toB){ return fromA<toB && fromB<toA; }
function formatDateEs(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"});
}
function dayCell(dnum, otherMonth, iso){
  if(otherMonth){ return '<div class="cal-day other-month"><div class="cal-day-num">'+dnum+'</div></div>'; }
  const c=S.calendar;
  const bookings = bookingsOnDate(iso);
  const cls = "cal-day"+(iso===DEMO_TODAY?" today":"")+(iso===c.selectedDate?" selected":"");
  const shown = bookings.slice(0,3).map(function(b){
    const f=fincaById(b.fincaId);
    const short = f ? f.name.replace(/^(Finca|Cabañas|Hacienda|Refugio)\s+/,"") : b.fincaId;
    return '<span class="cal-chip">'+esc(short)+'</span>';
  }).join('');
  const more = bookings.length>3 ? '<span class="cal-chip-more">+'+(bookings.length-3)+' más</span>' : '';
  return '<div class="'+cls+'" data-caldate="'+iso+'"><div class="cal-day-num">'+dnum+'</div>'+shown+more+'</div>';
}
function calGrid(){
  const c=S.calendar, y=c.year, m=c.month;
  const startWeekday = (new Date(y,m,1).getDay()+6)%7;
  const daysThis = new Date(y,m+1,0).getDate();
  const daysPrev = new Date(y,m,0).getDate();
  let cells = WEEKDAYS_ES.map(function(w){ return '<div class="cal-daylabel">'+w+'</div>'; }).join('');
  for(let i=startWeekday-1;i>=0;i--){ cells += dayCell(daysPrev-i, true, null); }
  for(let d=1; d<=daysThis; d++){ cells += dayCell(d, false, isoDate(y,m,d)); }
  const filled = startWeekday+daysThis;
  const trailing = (7-(filled%7))%7;
  for(let d=1; d<=trailing; d++){ cells += dayCell(d, true, null); }
  return '<div class="cal-grid">'+cells+'</div>';
}

  const c=S.calendar;

  } else {

    html += '<div class="cal-form-subhead">Datos de contacto del cliente</div>' +
      '<div class="field"><label>Celular</label><input id="docClienteCelular" placeholder="300 000 0000" value="'+esc(d.clienteCelular||"")+'"></div>' +
      '<div class="field"><label>Correo</label><input id="docClienteCorreo" type="email" placeholder="correo@ejemplo.com" value="'+esc(d.clienteCorreo||"")+'"></div>' +

      '<div class="field"><label>Ciudad</label><input id="docClienteCiudad" placeholder="Ciudad" value="'+esc(d.clienteCiudad||"")+'"></div>' +

  }

    html += '<div style="margin-top:18px;"><label style="display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">'+itemsLabel+'</label>';
    html += d.items.map(function(it,i){

        '<input type="number" min="1" placeholder="Cant." data-itemfield="qty" data-itemidx="'+i+'" value="'+it.qty+'">' +
        '<input type="number" min="0" step="1000" placeholder="Valor unit." data-itemfield="price" data-itemidx="'+i+'" value="'+it.price+'">' +
        '<button type="button" class="doc-item-remove" data-itemremove="'+i+'" aria-label="Quitar ítem">'+icon('close')+'</button>' +
      '</div>';
    }).join('');
    html += '<button type="button" class="btn btn-ghost btn-sm" id="docAddItem" style="margin-top:6px;">'+icon('plus')+' Agregar ítem</button></div>';
  }
  html += '<div class="field full" style="margin-top:14px;"><label>Observaciones (opcional)</label><textarea id="docObservaciones" rows="'+(type==="cotizacion"?"3":"2")+'" placeholder="'+(type==="cotizacion"?"Términos, incluye/no incluye, condiciones de pago…":"Notas adicionales…")+'" style="width:100%;border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--text);border-radius:var(--radius-s);padding:10px 12px;font-family:var(--font-body);font-size:14px;">'+esc(d.observaciones||"")+'</textarea></div>';
  html += '<button class="btn btn-accent btn-block" style="margin-top:22px;" id="docDownloadBtn">'+icon('download')+' Descargar PDF</button></div>';
  return html;
}

function generateDocPDF(){
  const d=S.docs, type=d.type;
  const counter=String(d.counters[type]).padStart(4,"0");
  const typeLabel = type==="cotizacion"?"COTIZACIÓN":type==="cobro"?"CUENTA DE COBRO":"CUENTA DE PAGO";
  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor){ toast("No se pudo cargar el generador de PDF. Revisa tu conexión."); return; }
  const doc = new jsPDFCtor({ unit:"mm", format:"letter" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 20;
  const logoReady = LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0;

  if(logoReady){
    try{
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({ opacity: 0.07 }));
      const wm=120;
      doc.addImage(LOGO_IMG, "PNG", (pageW-wm)/2, (pageH-wm)/2, wm, wm);
      doc.restoreGraphicsState();
    }catch(e){}
    try{ doc.addImage(LOGO_IMG, "PNG", marginX, 15, 14, 14); }catch(e){}
  }
  doc.setTextColor(31,41,38);
  doc.setFont("times","bold"); doc.setFontSize(15);
  doc.text("EL VIAJERO INQUIETO", marginX+18, 21);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.setTextColor(91,104,95);
  doc.text("Agencia de viajes · Eje cafetero, Colombia", marginX+18, 26);
  doc.setDrawColor(31,41,38); doc.setLineWidth(0.6);
  doc.line(marginX, 33, pageW-marginX, 33);

  let y=47;
  doc.setTextColor(62,106,111);
  doc.setFont("times","bold"); doc.setFontSize(18);
  doc.text(typeLabel+" No. "+counter, marginX, y);
  doc.setTextColor(91,104,95); doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text("Fecha: "+formatDateEs(d.fecha||DEMO_TODAY), pageW-marginX, y, { align:"right" });
  y+=10;
  doc.setDrawColor(233,225,210); doc.setLineWidth(0.3);
  doc.line(marginX, y, pageW-marginX, y);
  y+=8;

  if(type==="cotizacion"){
    doc.setFont("times","italic"); doc.setFontSize(11); doc.setTextColor(95,143,149);
    const tagLines = doc.splitTextToSize("Tu viaje te espera — este es el plan que armamos para ti.", pageW-marginX*2);
    doc.text(tagLines, marginX, y);
    y += 5.5*tagLines.length + 4;
  }

  function row(label, value){
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(91,104,95);
    doc.text(label, marginX, y);
    doc.setFont("helvetica","normal"); doc.setTextColor(31,41,38);
    const lines = doc.splitTextToSize(String(value||"—"), pageW-marginX*2-55);
    doc.text(lines, marginX+55, y);
    y += 6.2*Math.max(1,lines.length);
    doc.setDrawColor(237,235,227); doc.line(marginX,y-2.5,pageW-marginX,y-2.5);
    y+=4;
  }

  /* Bloque "De / Para": emisor y cliente en paralelo, como en cotizaciones y facturas reales */
  function partyBlock(x, w, tag, name, lines, yStart){
    let ly=yStart;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(138,149,142);
    doc.text(String(tag).toUpperCase(), x, ly);
    ly += 5.2;
    doc.setFont("times","bold"); doc.setFontSize(11.5); doc.setTextColor(31,41,38);
    const nameLines = doc.splitTextToSize(name||"—", w);
    doc.text(nameLines, x, ly);
    ly += 4.8*nameLines.length;
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(91,104,95);
    lines.forEach(function(line){
      const wrapped = doc.splitTextToSize(line, w);
      doc.text(wrapped, x, ly);
      ly += 4.2*wrapped.length;
    });
    return ly;
  }
  const colW = (pageW-marginX*2-14)/2;
  const leftX = marginX, rightX = marginX+colW+14;
  const emisorLines = type==="cotizacion"
    ? [EMISOR.ciudad, "Cel: "+EMISOR.telefono, EMISOR.correo]
    : [EMISOR.titular, EMISOR.identificacion, EMISOR.direccion, EMISOR.telefono+" · "+EMISOR.correo];
  const clienteTagPdf = type==="pago"?"Beneficiario":type==="cobro"?"Cobrar a":"Cliente";
  const clienteExtra = [];
  if(d.clienteId) clienteExtra.push(d.clienteId);
  if(type==="cotizacion"){
    if(d.clienteCelular) clienteExtra.push("Cel: "+d.clienteCelular);
    if(d.clienteCorreo) clienteExtra.push(d.clienteCorreo);
    const dirCiudad=[d.clienteDireccion,d.clienteCiudad].filter(Boolean).join(", ");
    if(dirCiudad) clienteExtra.push(dirCiudad);
  }
  const partyStartY = y;
  const yAfterLeft = partyBlock(leftX, colW, "De", EMISOR.nombre, emisorLines, partyStartY);
  const yAfterRight = partyBlock(rightX, colW, clienteTagPdf, d.cliente, clienteExtra, partyStartY);
  y = Math.max(yAfterLeft, yAfterRight) + 4;
  doc.setDrawColor(237,235,227); doc.setLineWidth(0.3);
  doc.line(marginX, y, pageW-marginX, y);
  y += 8;

  function totalBanner(label, valueText){
    const bannerH=16;
    doc.setFillColor(31,41,38);
    doc.roundedRect(marginX, y, pageW-marginX*2, bannerH, 2, 2, "F");
    doc.setTextColor(201,214,209); doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    doc.text(label, marginX+8, y+6.5);
    doc.setTextColor(247,245,239); doc.setFont("times","bold"); doc.setFontSize(15);
    doc.text(valueText, pageW-marginX-8, y+11.5, { align:"right" });
    y += bannerH+8;
  }

  if(type!=="cotizacion"){
    row("Forma de pago:", d.formaPago||"Transferencia");
  }
  if(type==="cotizacion" && d.objeto){
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(138,149,142);
    doc.text("ASUNTO", marginX, y);
    y+=5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(31,41,38);
    const objLines = doc.splitTextToSize(d.objeto, pageW-marginX*2);
    doc.text(objLines, marginX, y);
    y += 5*objLines.length + 6;
  }
  doc.setFillColor(31,41,38); doc.rect(marginX,y,pageW-marginX*2,8,"F");
  doc.setTextColor(247,245,239); doc.setFont("helvetica","bold"); doc.setFontSize(9);
  doc.text("Descripción", marginX+3, y+5.5);
  doc.text("Cant.", pageW-marginX-58, y+5.5);
  doc.text("Valor unit.", pageW-marginX-40, y+5.5);
  doc.text("Subtotal", pageW-marginX-3, y+5.5, { align:"right" });
  y+=8;
  doc.setTextColor(31,41,38); doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  let itemsTotal=0;
  (d.items||[]).forEach(function(it){
    const sub=(it.qty||0)*(it.price||0); itemsTotal+=sub;
    const descLines=doc.splitTextToSize(it.desc||"—", pageW-marginX*2-90);
    doc.text(descLines, marginX+3, y+5);
    doc.text(String(it.qty||0), pageW-marginX-58, y+5);
    doc.text(cop(it.price||0), pageW-marginX-40, y+5);
    doc.text(cop(sub), pageW-marginX-3, y+5, { align:"right" });
    y += 6.2*Math.max(1,descLines.length);
    doc.setDrawColor(237,235,227); doc.line(marginX,y-1,pageW-marginX,y-1);
    y+=3;
  });
  y+=3;
  totalBanner(type==="cotizacion"?"VALOR DE TU VIAJE":type==="pago"?"VALOR PAGADO":"VALOR A COBRAR", cop(itemsTotal));
  if(type==="cotizacion" && d.validoHasta){
    const label = "Válida hasta el "+formatDateEs(d.validoHasta);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    const tw = doc.getTextWidth(label)+10;
    doc.setDrawColor(143,168,154); doc.setFillColor(233,225,210); doc.setLineWidth(0.3);
    doc.roundedRect(marginX, y, tw, 8, 4, 4, "FD");
    doc.setTextColor(31,41,38);
    doc.text(label, marginX+5, y+5.4);
    y += 14;
  }
  if(type!=="cotizacion"){
    doc.setFont("helvetica","italic"); doc.setFontSize(9.5); doc.setTextColor(91,104,95);
    const wordsLines = doc.splitTextToSize("Son: "+copWords(itemsTotal)+".", pageW-marginX*2);
    doc.text(wordsLines, marginX, y);
    y += 5*wordsLines.length+6;
  }

  if(d.observaciones){
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(138,149,142);
    doc.text("OBSERVACIONES", marginX, y);
    y+=5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(91,104,95);
    const obsLines = doc.splitTextToSize(d.observaciones, pageW-marginX*2);
    doc.text(obsLines, marginX, y);
    y += 5*obsLines.length + 6;
  }

  /* Línea de firma del emisor, como en las cuentas de cobro/pago reales (la cotización no lleva firma formal) */
  if(type!=="cotizacion"){
    y += 8;
    const signW=70, signX=pageW/2-signW/2;
    doc.setDrawColor(31,41,38); doc.setLineWidth(0.3);
    doc.line(signX, y, signX+signW, y);
    y+=5;
    doc.setFont("times","bold"); doc.setFontSize(10); doc.setTextColor(31,41,38);
    doc.text(EMISOR.titular, pageW/2, y, { align:"center" });
    y+=4.5;
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(91,104,95);
    doc.text(EMISOR.identificacion, pageW/2, y, { align:"center" });
  }

  const footText = type==="cotizacion" ? (EMISOR.ciudad+"  ·  "+EMISOR.telefono+"  ·  "+EMISOR.correo) : (EMISOR.direccion+"  ·  "+EMISOR.telefono+"  ·  "+EMISOR.correo);
  doc.setDrawColor(230,230,230); doc.line(marginX, pageH-22, pageW-marginX, pageH-22);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(138,149,142);
  doc.text(footText, pageW/2, pageH-16, { align:"center" });

function setupRevealObserver(){
  const els=document.querySelectorAll(".reveal:not(.in-view)");
  if(!els.length) return;
  if(!("IntersectionObserver" in window)){ els.forEach(function(el){ el.classList.add("in-view"); }); return; }
  const obs=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ entry.target.classList.add("in-view"); obs.unobserve(entry.target); }
    });
  }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});
  els.forEach(function(el){ obs.observe(el); });
}
function animateCounters(){
  document.querySelectorAll("[data-countto]").forEach(function(el){
    const target=parseFloat(el.getAttribute("data-countto"));
    const decimals=parseInt(el.getAttribute("data-decimal")||"0",10);
    const prefix=el.getAttribute("data-prefix")||"";
    const start=performance.now();
    const dur=900;
    function tick(now){
      const p=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-p,3);
      el.textContent=prefix+(target*eased).toFixed(decimals);
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

/* ================= CHAT WIDGET (UI) ================= */
function chatBubble(msg){
  if(msg.who==="user"){
    return '<div class="chat-msg user">'+esc(msg.text)+'</div>';
  }
  let extra = "";
  if(msg.listings && msg.listings.length){
    extra = '<div class="chat-results">' + msg.listings.map(function(r){
      return '<button type="button" class="chat-result" data-chatgo="'+r.id+'"><span><b>'+esc(r.name)+'</b><span>'+esc(r.town)+', '+esc(r.dept)+' · ★ '+r.rating.toFixed(1)+'</span></span><strong>'+r.price+'</strong></button>';
    }).join('') + '</div>';
  }
  if(msg.chips && msg.chips.length){
    extra += '<div class="chat-suggestions">' + msg.chips.map(function(c){
      return '<button type="button" class="chat-chip" data-chatask="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('') + '</div>';
  }
  return '<div class="chat-msg bot">'+esc(msg.text)+extra+'</div>';
}
function renderChatWidget(){
  const c = S.chat;
  if(!c.messages.length){
    c.messages.push({who:"bot", text:"¡Hola! Soy el asistente de El Viajero Inquieto. Pregúntame por fincas, parques o tours — por ejemplo:", chips:["Fincas cerca a Manizales","Parques para niños","Tours de un día","Lo más barato"]});
  }
  let tooltip = "";
  if(!c.open && !c.tooltipDismissed && c.showTooltip){
    tooltip = '<div class="chat-tooltip" id="chatTooltip"><button type="button" id="chatTooltipClose" aria-label="Cerrar">'+icon('close')+'</button><p>¿Buscando algo especial? Pregúntame por fincas, parques o tours disponibles 👋</p></div>';
  }
  return '<div id="chatRoot">' +
    tooltip +
    '<div class="chat-panel'+(c.open?' open':'')+'" id="chatPanel">' +
      '<div class="chat-head"><img src="photos/logo-mark-white.png" alt=""><div><b>Asistente El Viajero Inquieto</b><span>Responde leyendo el catálogo en vivo</span></div></div>' +
      '<div class="chat-body" id="chatBody">' + c.messages.map(chatBubble).join('') + '</div>' +
      '<div class="chat-input-row"><input id="chatInput" type="text" placeholder="Ej. ¿qué finca hay cerca a Manizales?" autocomplete="off">' +
        '<button type="button" id="chatSend">'+icon('send')+'</button></div>' +
    '</div>' +
    '<button type="button" class="chat-fab'+(c.open?' open':'')+'" id="chatFab" aria-label="Abrir chat de ayuda">' +
      '<span class="icon-chat">'+icon('chat')+'</span><span class="icon-close">'+icon('close')+'</span>' +
      (!c.open && !c.tooltipDismissed && !c.hasInteracted ? '<span class="chat-dot"></span>' : '') +
    '</button>' +
  '</div>';
}
function chatScrollToBottom(){
  const body=document.getElementById("chatBody");
  if(body) body.scrollTop = body.scrollHeight;
}
function bindChatWidget(){
  const fab=document.getElementById("chatFab");
  const panel=document.getElementById("chatPanel");
  const input=document.getElementById("chatInput");
  const sendBtn=document.getElementById("chatSend");
  const tooltip=document.getElementById("chatTooltip");
  const tooltipClose=document.getElementById("chatTooltipClose");

  function openChat(){
    S.chat.open=true; S.chat.hasInteracted=true; S.chat.tooltipDismissed=true;
    try{ localStorage.setItem("vi_chat_seen","1"); }catch(e){}
    render();
    setTimeout(function(){ const i=document.getElementById("chatInput"); if(i) i.focus(); chatScrollToBottom(); }, 30);
  }
  function closeChat(){ S.chat.open=false; render(); }

  if(fab){ fab.addEventListener("click", function(){ S.chat.open ? closeChat() : openChat(); }); }
  if(tooltip){ tooltip.addEventListener("click", function(e){ if(e.target.id!=="chatTooltipClose") openChat(); }); }
  if(tooltipClose){ tooltipClose.addEventListener("click", function(e){
    e.stopPropagation(); S.chat.tooltipDismissed=true;
    try{ localStorage.setItem("vi_chat_seen","1"); }catch(e2){}
    render();
  }); }

  function send(text){
    const q=(text!==undefined?text:(input?input.value:"")).trim();
    if(!q) return;
    S.chat.messages.push({who:"user", text:q});
    const a=answerChat(q);
    S.chat.messages.push({who:"bot", text:a.text, chips:a.chips, listings:a.listings});
    render();
    chatScrollToBottom();
  }
  if(sendBtn){ sendBtn.addEventListener("click", function(){ send(); }); }
  if(input){ input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); send(); } }); }
  document.querySelectorAll("[data-chatask]").forEach(function(el){
    el.addEventListener("click", function(){ send(el.getAttribute("data-chatask")); });
  });
  document.querySelectorAll("[data-chatgo]").forEach(function(el){
    el.addEventListener("click", function(){ navigate("listing", {id: el.getAttribute("data-chatgo")}); });
  });
  chatScrollToBottom();
}

function start(data){
  try{
    const h=location.hash;
    if(h==="#/admin"){ S.route = S.admin.authed ? "admin" : "admin-login"; }
    else if(h==="#/gestion"){ S.route = S.gestion.authed ? "gestion" : "gestion-login"; }
  }catch(e){}
  render();
  window.addEventListener("hashchange", function(){
    const h=location.hash;
    if(h==="#/admin"){
      if(S.route!=="admin" && S.route!=="admin-login"){ navigate(S.admin.authed?"admin":"admin-login"); }
    } else if(h==="#/gestion"){
      if(S.route!=="gestion" && S.route!=="gestion-login"){ navigate(S.gestion.authed?"gestion":"gestion-login"); }
    } else if(h===""||h==="#"){
      if(["admin","admin-login","gestion","gestion-login"].indexOf(S.route)>-1){ navigate("home"); }
    }
  });
  document.addEventListener("keydown", function(e){
    if(!S.detail.lightbox) return;
    const l=byId(S.detail.forId); const gallery=l?galleryFor(l):[];
    if(e.key==="Escape"){ S.detail.lightbox=false; render(); }
    else if(e.key==="ArrowLeft" && gallery.length>1){ S.detail.photoIndex=(S.detail.photoIndex-1+gallery.length)%gallery.length; render(); }
    else if(e.key==="ArrowRight" && gallery.length>1){ S.detail.photoIndex=(S.detail.photoIndex+1)%gallery.length; render(); }
  });
  let alreadySeen=false;
  try{ alreadySeen = localStorage.getItem("vi_chat_seen")==="1"; }catch(e){}
  if(!alreadySeen){
    setTimeout(function(){
      if(S.chat.open || S.chat.hasInteracted) return;
      S.chat.showTooltip=true;
      render();
      setTimeout(function(){
        if(!S.chat.open){ S.chat.tooltipDismissed=true; render(); }
      }, 9000);
    }, 2200);
  }
}
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(start); } else { start({}); }

})();
